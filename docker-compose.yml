name: incident-analysis-platform

services:
  postgres:
    image: pgvector/pgvector:0.8.6-pg16
    container_name: incident-platform-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-incident_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 10

  kafka:
    image: apache/kafka:4.3.1
    container_name: incident-platform-kafka
    restart: unless-stopped
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,PLAINTEXT_INTERNAL://:29092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://localhost:${KAFKA_PORT:-9092},PLAINTEXT_INTERNAL://kafka:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,PLAINTEXT_INTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT_INTERNAL
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@localhost:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      CLUSTER_ID: "5L6g3nShT-eMCtK--X86sw"
    volumes:
      - kafka-data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 10s
      timeout: 10s
      retries: 10

  # ---------------------------------------------------------------------------------------------
  # Application services, under the "apps" profile so `docker compose up -d` starts only the
  # infrastructure by default. That matters on a small machine: infrastructure alone is light, while
  # the whole platform wants roughly 2 GB.
  #
  # Build the jars and the UI bundle first, then start them:
  #   ./mvnw package -DskipTests
  #   (cd frontend/incident-ui && npm ci && npm run build)
  #   docker compose --profile apps up -d --build
  # ---------------------------------------------------------------------------------------------

  incident-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: incident-service
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-incident_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-local-development-signing-secret-change-me}
      LOG_SERVICE_URL: http://log-ingestion-service:8082
    ports: ["8081:8081"]

  log-ingestion-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: log-ingestion-service
    depends_on:
      postgres: {condition: service_healthy}
      kafka: {condition: service_healthy}
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incident_platform}
      POSTGRES_USER: ${POSTGRES_USER:-incident_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-local-development-signing-secret-change-me}
    ports: ["8082:8082"]

  ai-analysis-service:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: ai-analysis-service
    depends_on:
      postgres: {condition: service_healthy}
    environment:
      # The vector store lives in this service's own schema, with public kept on the search path so
      # the pgvector extension's types still resolve.
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/${POSTGRES_DB:-incident_platform}?currentSchema=ai,public
      POSTGRES_USER: ${POSTGRES_USER:-incident_platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      PLATFORM_JWT_SECRET: ${PLATFORM_JWT_SECRET:-local-development-signing-secret-change-me}
      INCIDENT_SERVICE_URL: http://incident-service:8081
      GEMINI_API_KEY: ${GEMINI_API_KEY:-not-configured}
      AI_CHAT_MODEL: ${AI_CHAT_MODEL:-gemini-3.5-flash-lite}
      KNOWLEDGE_SOURCE_PATH: /app/sample-data
      JAVA_OPTS: -Xmx480m
    volumes:
      - ./sample-data:/app/sample-data:ro
    ports: ["8083:8083"]

  event-simulator:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.service
      args:
        SERVICE: event-simulator
    depends_on:
      kafka: {condition: service_healthy}
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:29092
    ports: ["8084:8084"]

  frontend:
    profiles: [apps]
    build:
      context: .
      dockerfile: docker/Dockerfile.frontend
    ports: ["8085:80"]

volumes:
  postgres-data:
  kafka-data:
