server:
  port: 8084

spring:
  application:
    name: event-simulator
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    producer:
      # Serializers are wired in KafkaProducerConfig so they use Spring's managed ObjectMapper
      # (ISO-8601 timestamps) rather than a reflectively created default.
      acks: all

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
