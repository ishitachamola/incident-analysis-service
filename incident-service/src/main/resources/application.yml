server:
  port: 8081

spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:incident_platform}
    username: ${POSTGRES_USER:incident_platform}
    password: ${POSTGRES_PASSWORD:dev_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
