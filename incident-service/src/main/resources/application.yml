server:
  port: 8081

spring:
  application:
    name: incident-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:incident_platform}
    username: ${POSTGRES_USER:incident_platform}
    password: ${POSTGRES_PASSWORD:dev_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: incident
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Each service owns a schema of its own inside the shared database. That keeps migrations and
    # table ownership isolated per service (no cross-service collisions, no startup ordering
    # coupling) without running a separate database instance per service.
    schemas: incident
    default-schema: incident
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: incident-service-group
      auto-offset-reset: earliest
      # Deserializers are wired per listener in KafkaConfig, since this service consumes two
      # topics carrying different payload types.
    producer:
      acks: all

platform:
  log-service:
    base-url: ${LOG_SERVICE_URL:http://localhost:8082}
  timeline:
    lookback: 30m
  jwt:
    # Dev default; override with PLATFORM_JWT_SECRET. Every service must share the same value.
    secret: ${PLATFORM_JWT_SECRET:local-development-signing-secret-change-me}
    issuer: incident-platform
    token-validity: 8h
  # Stand-in for an identity provider so the platform runs end to end on one machine.
  auth:
    users:
      - username: admin
        password: ${ADMIN_PASSWORD:admin123}
        roles: [ADMIN, SRE, USER]
      - username: sre
        password: ${SRE_PASSWORD:sre123}
        roles: [SRE, USER]
      - username: viewer
        password: ${VIEWER_PASSWORD:viewer123}
        roles: [USER]

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
