server:
  port: 8082

spring:
  application:
    name: log-ingestion-service
  datasource:
    url: jdbc:postgresql://localhost:${POSTGRES_PORT:5432}/${POSTGRES_DB:incident_platform}
    username: ${POSTGRES_USER:incident_platform}
    password: ${POSTGRES_PASSWORD:dev_local_only}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        default_schema: ingestion
  flyway:
    enabled: true
    locations: classpath:db/migration
    # Each service owns a schema of its own inside the shared database. That keeps migrations and
    # table ownership isolated per service (no cross-service collisions, no startup ordering
    # coupling) without running a separate database instance per service.
    schemas: ingestion
    default-schema: ingestion
    create-schemas: true
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: log-ingestion-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      # ErrorHandlingDeserializer keeps an unparseable message from becoming a poison pill that
      # blocks the partition forever: the payload arrives as null and is routed to the DLT instead.
      value-deserializer: org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
      properties:
        spring.deserializer.value.delegate.class: org.springframework.kafka.support.serializer.JsonDeserializer
        spring.json.trusted.packages: com.incidentplatform.events
        spring.json.value.default.type: com.incidentplatform.events.LogEvent
        spring.json.use.type.headers: false
    producer:
      # Serializers are wired in KafkaProducerConfig so they use Spring's managed ObjectMapper.
      acks: all

# Thresholds for the error-rate detection rule.
incident-detection:
  enabled: true
  interval: 15s
  window: 10m
  min-error-count: 10
  error-rate-threshold: 0.10
  cooldown: 30m

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics
